[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blind-finder"
version = "0.1.0"
description = "Extensible framework for authorized Boolean-based Blind SQLi testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
]

[project.scripts]
blind-finder = "cli.main:main"

[tool.setuptools]
packages = [
    "cli",
    "config",
    "core",
    "detection",
    "exceptions",
    "models",
    "payloads",
    "transport",
    "utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]